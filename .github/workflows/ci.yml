name: Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

# A newer run for the same branch or pull request cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Unit, codec, packaged-consumer and browser suites. No service stack.
  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux on Blacksmith; Windows stays GitHub-hosted (it ships Edge).
        os: [blacksmith-4vcpu-ubuntu-2404, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - run: npm install
      - run: npx playwright install --with-deps chromium firefox webkit
      # Windows runners ship Edge; branded coverage is PORT-01 evidence.
      - if: runner.os == 'Windows'
        run: echo "CELERIS_BROWSER_CHANNELS=msedge" >> $env:GITHUB_ENV
      # Build, both typechecks, formatting and the suites.
      - run: npm run check
